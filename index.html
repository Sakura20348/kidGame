<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LittleReaderLab — Read. Explore. Grow.</title>
    <meta name="description" content="Interactive reading adventures for young English learners." />
    <meta name="theme-color" content="#1C5CC4" />
    <script>
      // show this tab's account theme before the app loads (no white flash in dark mode)
      try {
        var who = (sessionStorage.getItem("pragmalab.email") || localStorage.getItem("pragmalab.email") || "guest").toLowerCase()
        var t = localStorage.getItem("pragmalab.theme:" + who) || localStorage.getItem("theme") || "system"
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
